add_newline = false
scan_timeout = 10

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character
"""

[character]
success_symbol = '[●](bold green)'
error_symbol = '[●](bold red)'

[line_break]
disabled = false

[directory]
truncation_length = 4

[cmd_duration]
min_time = 500
style = "dimmed white"
format = "[$duration]($style) "

[git_branch]
symbol = " "

# [git_commit]
# commit_hash_length = 7
# format = "on [$hash]($style) "
# tag_symbol = "🔖 "

[git_status]
ahead = "⇡${ahead_count}"
diverged = "⇅⇡${ahead_count}⇣${behind_count}"
behind = "⇣${behind_count}"

# [git_state]
# format = '[\($state( $progress_current of $progress_total)\)]($style)'
# cherry_pick = "[🍒 PICKING](bold red)"
#
# [git_metrics]
# disabled = false
# added_style = "bold blue"
# format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

[package]
disabled = true
